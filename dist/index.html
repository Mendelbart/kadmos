<!doctype html><html lang=en><head><title>Kadmos</title><meta content="width=device-width" name=viewport><link href=favicon.svg rel=icon><link href=css/index.css rel=stylesheet><script defer src=js/index.js></script></head><body><div class=heading-with-buttons id=game-heading><h1 id=game-heading-default>Kadmos</h1><h1 id=game-heading-dataset></h1><button aria-label=Settings class=icon-button id=open-settings-button type=button><i class="fa fa-gear" aria-hidden=true></i></button><button aria-label=Exit class=icon-button id=stop-game-button style=display:none type=button><i class="fa fa-exit" aria-hidden=true></i></button></div><div id=new-game-settings style=display:none><div class=styled-select id=game-select-container><select aria-label="Select Dataset" id=datasetSelect></select></div><div class=pages-container id=game-settings-pages><div class=pages-header><div class=pages-headings><h2 class=page-heading data-for=game-filters>Select <span class=term-letters></span></h2><h2 class=page-heading data-for=game-settings style=display:none>Settings</h2></div><div class="pages-buttons button-group"><button class="pages-button pages-back-button button-grey" style=display:none>Back</button><button class="pages-button pages-next-button button-accent">Next</button><button class="pages-button pages-finish-button button-accent" id=start-game-button style=display:none>Play</button></div></div><div class=pages-contents><div class=page-content id=game-filters><div class=settings id=dataset-filter-settings></div></div><div class="settings page-content" id=game-settings style=display:none><div class=settings id=dataset-game-settings></div><div class=settings id=generic-game-settings></div></div></div></div></div><div id=game-container style=display:none><div id=progress-bar></div><div id=game-cards><div id=game-main-card-container></div><div style="display: none" id=game-reference-cards></div></div><div id=game-inputs-evals-container><div id=game-inputs></div><div id=game-evals></div></div><div id=game-footer><button class=button-accent id=item-submit-button>Submit</button><button class=button-accent id=item-next-button style=display:none type=button>Next</button></div><div class="ribbon ribbon-closable" id=live-settings><div class="ribbon-buttons button-group"><input data-content-id=font-settings id=font-settings-button type=checkbox value=font><label class=button for=font-settings-button></label></div><div class=ribbon-contents><div class="settings ribbon-content" id=font-settings></div></div></div></div></body></html>
