<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Kadmos</title>

        <meta name="viewport" content="width=device-width"/>

        <link rel="icon" href="favicon.svg">
        <link href="css/index.css" type="text/css" rel="stylesheet">

        <script src="js/index.js" defer></script>
    </head>

    <body>
        <div id="game-heading" class="heading-with-buttons">
            <h1 id="game-heading-default">Kadmos</h1>
            <h1 id="game-heading-dataset"></h1>
            <button type="button" id="open-settings-button" class="icon-button" aria-label="Settings"><i aria-hidden="true" class="fa fa-gear"></i></button>
            <button type="button" id="stop-game-button" class="icon-button" style="display:none" aria-label="Exit"><i aria-hidden="true" class="fa fa-exit"></i></button>
        </div>

        <div id="new-game-settings" style="display:none">
            <div id="game-select-container" class="styled-select">
                <select id="datasetSelect" aria-label="Select Dataset"></select>
            </div>

            <div id="game-settings-pages" class="pages-container">
                <div class="pages-header">
                    <div class="pages-headings">
                        <h2 class="page-heading" data-for="game-filters">Select <span class="term-letters"></span></h2>
                        <h2 class="page-heading" data-for="game-settings" style="display:none">Settings</h2>
                    </div>

                    <div class="pages-buttons button-group">
                        <button class="pages-button pages-back-button button-grey" style="display:none">Back</button>
                        <button class="pages-button pages-next-button button-accent">Next</button>
                        <button class="pages-button pages-finish-button button-accent" id="start-game-button" style="display:none">Play</button>
                    </div>
                </div>

                <div class="pages-contents">
                    <div id="game-filters" class="page-content">
                        <div id="dataset-filter-settings" class="settings inline"></div>
                    </div>
                    <div id="game-settings" class="settings page-content" style="display:none">
                        <div id="dataset-game-settings" class="settings"></div>
                        <div id="generic-game-settings" class="settings"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-container" style="display:none">
            <div id="progress-bar"></div>

            <div id="game-cards">
                <div id="game-main-card-container"></div>
                <div id="game-reference-cards" style="display: none"></div>
            </div>

            <div id="game-inputs-evals-container">
                <div id="game-inputs"></div>
                <div id="game-evals"></div>
            </div>

            <div id="game-footer">
                <button type="submit" id="item-submit-button" class="button-accent">Submit</button>
                <button type="button" id="item-next-button" class="button-accent" style="display:none">Next</button>
            </div>

            <div id="live-settings" class="ribbon ribbon-closable">
                <div class="ribbon-buttons button-group">
                    <input type="checkbox" value="font" id="font-settings-button" data-content-id="font-settings">
                    <label for="font-settings-button" class="button"></label>
                </div>
                <div class="ribbon-contents">
                    <div id="font-settings" class="settings ribbon-content"></div>
                </div>
            </div>
        </div>
    </body>
</html>
